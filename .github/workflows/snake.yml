name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # Two monochrome snakes: dark ink for light mode, cream for dark mode
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%230B0C0E&color_dots=%23E4E0D4,%23C9C5B8,%239B9A94,%235E5D58,%230B0C0E
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23F7F4EB&color_dots=%231A1B1F,%233A3B3F,%236B6C70,%23A8A9AD,%23F7F4EB

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
