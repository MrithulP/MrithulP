<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-labelledby="sg-t">
<title id="sg-t">Mrithul — Build. Learn. Repeat.</title>
<defs>
