.sg-name{stroke:#1A1A19;stroke-width:1;fill:#1A1A19;fill-opacity:0;stroke-dasharray:900;stroke-dashoffset:900;animation:sg-write 3.6s cubic-bezier(.65,0,.35,1) .3s forwards}
.sg-rule{stroke-dasharray:1000;stroke-dashoffset:1000;animation:sg-draw 2.4s cubic-bezier(.65,0,.35,1) 1.6s forwards}
.sg-in{animation:sg-in 1.4s ease 2.6s both}
