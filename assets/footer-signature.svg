<radialGradient id="sg-glow" cx="50%" cy="100%" r="70%"><stop offset="0" stop-color="#DAD5C6" stop-opacity=".7"/><stop offset="1" stop-color="#CBC6B6" stop-opacity="0"/></radialGradient>
<linearGradient id="sg-line" gradientUnits="userSpaceOnUse" x1="100" y1="0" x2="1100" y2="0"><stop offset="0" stop-color="#DAD5C6" stop-opacity="0"/><stop offset=".5" stop-color="#3A3A38"/><stop offset="1" stop-color="#DAD5C6" stop-opacity="0"/></linearGradient>
