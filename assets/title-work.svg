<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="03 Selected work: Built to learn.">
<defs>
<linearGradient id="tw-line" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0"><stop offset="0" stop-color="#3A3A38"/><stop offset=".6" stop-color="#DAD5C6"/><stop offset="1" stop-color="#DAD5C6" stop-opacity="0"/></linearGradient>
<linearGradient id="tw-sheen" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#1A1A19"/><stop offset=".5" stop-color="#6B6A64"/><stop offset="1" stop-color="#1A1A19"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;1500 0;1500 0" keyTimes="0;.4;1" dur="7s" begin="1.5s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="tw-pulse"><stop offset="0" stop-color="#000"/><stop offset=".5" stop-color="#1A1A19" stop-opacity=".6"/><stop offset="1" stop-color="#3A3A38" stop-opacity="0"/></radialGradient>
</defs>
<style>.tw-serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif}
.tw-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.tw-sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.tw-in{animation:tw-in 1.2s cubic-bezier(.16,1,.3,1) both}
.tw-d1{animation-delay:.15s}.tw-d2{animation-delay:.4s}.tw-d3{animation-delay:.65s}
.tw-chip{animation:tw-chip .7s cubic-bezier(.34,1.56,.64,1) both}
.tw-draw{stroke-dasharray:700;stroke-dashoffset:700;animation:tw-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards}
.tw-trace{stroke-dasharray:564 3136;stroke-dashoffset:3700;animation:tw-trace 7s linear infinite}
@keyframes tw-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes tw-chip{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes tw-draw{to{stroke-dashoffset:0}}
@keyframes tw-trace{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.tw-in,.tw-chip{animation:none}.tw-draw{animation:none;stroke-dashoffset:0}.tw-trace{display:none}}
</style>
<g class="tw-in"><text class="tw-mono" x="40" y="34" font-size="15" letter-spacing="3" fill="#3A3A38"><tspan fill="#1A1A19">03</tspan>   SELECTED WORK</text></g>
<g class="tw-in tw-d2"><text class="tw-serif" x="38" y="84" font-size="48" font-weight="300" letter-spacing="-1" fill="#0B0C0E">Built to <tspan font-style="italic" fill="url(#tw-sheen)">learn.</tspan></text></g>
<g class="tw-in tw-d3"><text class="tw-mono" x="1160" y="34" text-anchor="end" font-size="13" letter-spacing="2.4" fill="#3A3A38">PROJECTS</text></g>
<path class="tw-draw" d="M40 106 H1160" stroke="url(#tw-line)" stroke-width="1"/>
<circle cx="40" cy="106" r="7" fill="url(#tw-pulse)" opacity="0"><animate attributeName="cx" values="40;1160" dur="6s" begin="2.3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/><animate attributeName="opacity" values="0;1;0" keyTimes="0;.15;1" dur="6s" begin="2.3s" repeatCount="indefinite"/></circle>
</svg>