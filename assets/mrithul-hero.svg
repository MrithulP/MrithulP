<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="h-t">
<title id="h-t">Mrithul Padinhattayil — Data science, AI and computer vision. Build. Learn. Repeat.</title>
<defs>
<linearGradient id="h-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F4EB"/><stop offset="1" stop-color="#EEEADF"/></linearGradient>
<radialGradient id="h-glow" cx="78%" cy="30%" r="55%"><stop offset="0" stop-color="#DAD5C6" stop-opacity=".55"/><stop offset="1" stop-color="#CBC6B6" stop-opacity="0"/></radialGradient>
<pattern id="h-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#3A3A38" stroke-opacity=".07"/></pattern>
<filter id="h-gf" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="h-clip"><rect width="1200" height="480" rx="18"/></clipPath>
<linearGradient id="h-tr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0C0E"/><stop offset=".45" stop-color="#1A1A19"/><stop offset="1" stop-color="#3A3A38" stop-opacity="0"/></linearGradient>
<linearGradient id="h-name" gradientUnits="userSpaceOnUse" x1="-400" y1="0" x2="-60" y2="0"><stop offset="0" stop-color="#1A1A19"/><stop offset=".5" stop-color="#6B6A64"/><stop offset="1" stop-color="#3A3A38"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;1100 0;1100 0" keyTimes="0;.4;1" dur="8s" begin="3s" repeatCount="indefinite"/></linearGradient></defs>
<style>.h-serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif}
.h-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.h-sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.h-in{animation:h-in 1.2s cubic-bezier(.16,1,.3,1) both}
.h-d1{animation-delay:.15s}.h-d2{animation-delay:.4s}.h-d3{animation-delay:.65s}
.h-chip{animation:h-chip .7s cubic-bezier(.34,1.56,.64,1) both}
.h-draw{stroke-dasharray:700;stroke-dashoffset:700;animation:h-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards}
.h-trace{stroke-dasharray:564 3136;stroke-dashoffset:3700;animation:h-trace 7s linear infinite}
@keyframes h-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes h-chip{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes h-draw{to{stroke-dashoffset:0}}
@keyframes h-trace{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.h-in,.h-chip{animation:none}.h-draw{animation:none;stroke-dashoffset:0}.h-trace{display:none}}
</style>
