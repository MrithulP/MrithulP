<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="04 Toolkit: The tools I reach for.">
<defs>
<linearGradient id="tt-line" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0"><stop offset="0" stop-color="#CFCBBE"/><stop offset=".6" stop-color="#55565B"/><stop offset="1" stop-color="#55565B" stop-opacity="0"/></linearGradient>
<linearGradient id="tt-sheen" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#F7F4EB"/><stop offset=".5" stop-color="#9B9A94"/><stop offset="1" stop-color="#F7F4EB"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;1500 0;1500 0" keyTimes="0;.4;1" dur="7s" begin="1.5s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="tt-pulse"><stop offset="0" stop-color="#F7F4EB"/><stop offset=".5" stop-color="#F7F4EB" stop-opacity=".6"/><stop offset="1" stop-color="#CFCBBE" stop-opacity="0"/></radialGradient>
</defs>
<style>.tt-serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif}
.tt-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.tt-sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.tt-in{animation:tt-in 1.2s cubic-bezier(.16,1,.3,1) both}
.tt-d1{animation-delay:.15s}.tt-d2{animation-delay:.4s}.tt-d3{animation-delay:.65s}
.tt-chip{animation:tt-chip .7s cubic-bezier(.34,1.56,.64,1) both}
.tt-draw{stroke-dasharray:700;stroke-dashoffset:700;animation:tt-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards}
.tt-trace{stroke-dasharray:564 3136;stroke-dashoffset:3700;animation:tt-trace 7s linear infinite}
@keyframes tt-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes tt-chip{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes tt-draw{to{stroke-dashoffset:0}}
@keyframes tt-trace{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.tt-in,.tt-chip{animation:none}.tt-draw{animation:none;stroke-dashoffset:0}.tt-trace{display:none}}
</style>
<g class="tt-in"><text class="tt-mono" x="40" y="34" font-size="15" letter-spacing="3" fill="#CFCBBE"><tspan fill="#F7F4EB">04</tspan>   TOOLKIT</text></g>
<g class="tt-in tt-d2"><text class="tt-serif" x="38" y="84" font-size="48" font-weight="300" letter-spacing="-1" fill="#F7F4EB">The tools I <tspan font-style="italic" fill="url(#tt-sheen)">reach for.</tspan></text></g>
<g class="tt-in tt-d3"><text class="tt-mono" x="1160" y="34" text-anchor="end" font-size="13" letter-spacing="2.4" fill="#CFCBBE">STACK</text></g>
<path class="tt-draw" d="M40 106 H1160" stroke="url(#tt-line)" stroke-width="1"/>
<circle cx="40" cy="106" r="7" fill="url(#tt-pulse)" opacity="0"><animate attributeName="cx" values="40;1160" dur="6s" begin="2.3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/><animate attributeName="opacity" values="0;1;0" keyTimes="0;.15;1" dur="6s" begin="2.3s" repeatCount="indefinite"/></circle>
</svg>