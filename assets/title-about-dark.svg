<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="01 About: Hello, I&#x27;m Mrithul.">
<defs>
<linearGradient id="ta-line" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0"><stop offset="0" stop-color="#CFCBBE"/><stop offset=".6" stop-color="#55565B"/><stop offset="1" stop-color="#55565B" stop-opacity="0"/></linearGradient>
<linearGradient id="ta-sheen" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#F7F4EB"/><stop offset=".5" stop-color="#9B9A94"/><stop offset="1" stop-color="#F7F4EB"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;1500 0;1500 0" keyTimes="0;.4;1" dur="7s" begin="1.5s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="ta-pulse"><stop offset="0" stop-color="#F7F4EB"/><stop offset=".5" stop-color="#F7F4EB" stop-opacity=".6"/><stop offset="1" stop-color="#CFCBBE" stop-opacity="0"/></radialGradient>
</defs>
<style>.ta-serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif}
.ta-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.ta-sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.ta-in{animation:ta-in 1.2s cubic-bezier(.16,1,.3,1) both}
.ta-d1{animation-delay:.15s}.ta-d2{animation-delay:.4s}.ta-d3{animation-delay:.65s}
.ta-chip{animation:ta-chip .7s cubic-bezier(.34,1.56,.64,1) both}
.ta-draw{stroke-dasharray:700;stroke-dashoffset:700;animation:ta-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards}
.ta-trace{stroke-dasharray:564 3136;stroke-dashoffset:3700;animation:ta-trace 7s linear infinite}
@keyframes ta-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes ta-chip{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ta-draw{to{stroke-dashoffset:0}}
@keyframes ta-trace{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.ta-in,.ta-chip{animation:none}.ta-draw{animation:none;stroke-dashoffset:0}.ta-trace{display:none}}
</style>
<g class="ta-in"><text class="ta-mono" x="40" y="34" font-size="15" letter-spacing="3" fill="#CFCBBE"><tspan fill="#F7F4EB">01</tspan>   ABOUT</text></g>
<g class="ta-in ta-d2"><text class="ta-serif" x="38" y="84" font-size="48" font-weight="300" letter-spacing="-1" fill="#F7F4EB">Hello, I&#x27;m <tspan font-style="italic" fill="url(#ta-sheen)">Mrithul.</tspan></text></g>
<g class="ta-in ta-d3"><text class="ta-mono" x="1160" y="34" text-anchor="end" font-size="13" letter-spacing="2.4" fill="#CFCBBE">WHO I AM</text></g>
<path class="ta-draw" d="M40 106 H1160" stroke="url(#ta-line)" stroke-width="1"/>
<circle cx="40" cy="106" r="7" fill="url(#ta-pulse)" opacity="0"><animate attributeName="cx" values="40;1160" dur="6s" begin="2.3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/><animate attributeName="opacity" values="0;1;0" keyTimes="0;.15;1" dur="6s" begin="2.3s" repeatCount="indefinite"/></circle>
</svg>