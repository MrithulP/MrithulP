<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="ab-t">
<title id="ab-t">About: BCA (Hons.) Data Science student at Chandigarh University. Primary language Python; also C, C++, R, SQL and JavaScript. Focus on machine learning, AI and computer vision.</title>
<defs>
<linearGradient id="ab-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F4EB"/><stop offset="1" stop-color="#EEEADF"/></linearGradient>
<radialGradient id="ab-glow" cx="82%" cy="30%" r="55%"><stop offset="0" stop-color="#DAD5C6" stop-opacity=".55"/><stop offset="1" stop-color="#CBC6B6" stop-opacity="0"/></radialGradient>
<pattern id="ab-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#3A3A38" stroke-opacity=".07"/></pattern>
<filter id="ab-gf" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="ab-clip"><rect width="1200" height="300" rx="18"/></clipPath>
<linearGradient id="ab-tr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0C0E"/><stop offset=".45" stop-color="#1A1A19"/><stop offset="1" stop-color="#3A3A38" stop-opacity="0"/></linearGradient>
</defs>
<style>.ab-serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif}
.ab-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.ab-sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.ab-in{animation:ab-in 1.2s cubic-bezier(.16,1,.3,1) both}
.ab-d1{animation-delay:.15s}.ab-d2{animation-delay:.4s}.ab-d3{animation-delay:.65s}
.ab-chip{animation:ab-chip .7s cubic-bezier(.34,1.56,.64,1) both}
.ab-draw{stroke-dasharray:700;stroke-dashoffset:700;animation:ab-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards}
.ab-trace{stroke-dasharray:564 3136;stroke-dashoffset:3700;animation:ab-trace 7s linear infinite}
@keyframes ab-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes ab-chip{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ab-draw{to{stroke-dashoffset:0}}
@keyframes ab-trace{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.ab-in,.ab-chip{animation:none}.ab-draw{animation:none;stroke-dashoffset:0}.ab-trace{display:none}}
</style>
<g clip-path="url(#ab-clip)">
<rect width="1200" height="300" fill="url(#ab-bg)"/>
<rect x="720" width="480" height="300" fill="url(#ab-grid)"/>
<rect width="1200" height="300" fill="url(#ab-glow)"/>
<g class="ab-in ab-d1">
<text class="ab-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#3A3A38">DATA SCIENCE · AI · BUILDER</text>
<text class="ab-serif" x="54" y="130" font-size="44" font-weight="300" letter-spacing="-1.2" fill="#0B0C0E">I build to learn,</text>
<text class="ab-serif" x="54" y="182" font-size="44" font-weight="300" font-style="italic" letter-spacing="-1.2" fill="#1A1A19">then build better.</text>
<text class="ab-sans" x="56" y="226" font-size="16" fill="#5E5D58">Practical projects across data science, AI and software development,</text>
<text class="ab-sans" x="56" y="250" font-size="16" fill="#5E5D58">with web apps alongside the data work and a growing interest in research.</text>
</g>
<line x1="720" y1="40" x2="720" y2="270" stroke="#3A3A38" stroke-opacity=".18"/>
<g class="ab-in" style="animation-delay:0.50s"><text class="ab-mono" x="760" y="70" font-size="11" letter-spacing="2" fill="#3A3A38">PROGRAMME</text><text class="ab-sans" x="760" y="88" font-size="16" fill="#0B0C0E">BCA (Hons.) Data Science</text><line x1="760" y1="98" x2="1140" y2="98" stroke="#3A3A38" stroke-opacity=".12"/></g><g class="ab-in" style="animation-delay:0.62s"><text class="ab-mono" x="760" y="112" font-size="11" letter-spacing="2" fill="#3A3A38">UNIVERSITY</text><text class="ab-sans" x="760" y="130" font-size="16" fill="#0B0C0E">Chandigarh University</text><line x1="760" y1="140" x2="1140" y2="140" stroke="#3A3A38" stroke-opacity=".12"/></g><g class="ab-in" style="animation-delay:0.74s"><text class="ab-mono" x="760" y="154" font-size="11" letter-spacing="2" fill="#3A3A38">PRIMARY</text><text class="ab-sans" x="760" y="172" font-size="16" fill="#0B0C0E">Python</text><line x1="760" y1="182" x2="1140" y2="182" stroke="#3A3A38" stroke-opacity=".12"/></g><g class="ab-in" style="animation-delay:0.86s"><text class="ab-mono" x="760" y="196" font-size="11" letter-spacing="2" fill="#3A3A38">ALSO</text><text class="ab-sans" x="760" y="214" font-size="16" fill="#0B0C0E">C · C++ · R · SQL · JavaScript</text><line x1="760" y1="224" x2="1140" y2="224" stroke="#3A3A38" stroke-opacity=".12"/></g><g class="ab-in" style="animation-delay:0.98s"><text class="ab-mono" x="760" y="238" font-size="11" letter-spacing="2" fill="#3A3A38">FOCUS</text><text class="ab-sans" x="760" y="256" font-size="16" fill="#0B0C0E">ML · AI · Computer Vision</text><line x1="760" y1="266" x2="1140" y2="266" stroke="#3A3A38" stroke-opacity=".12"/></g>
<rect x=".5" y=".5" width="1199" height="299" rx="17.5" fill="none" stroke="#3A3A38" stroke-opacity=".2"/>
<rect class="ab-trace" x=".5" y=".5" width="1199" height="299" rx="17.5" fill="none" stroke="url(#ab-tr)" stroke-width="1.6" stroke-linecap="round"/>
</g></svg>