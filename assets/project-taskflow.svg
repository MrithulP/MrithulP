<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" role="img" aria-labelledby="p2-t">
<title id="p2-t">TaskFlow: a web-based task management project focused on organising tasks through a simple interface.</title>
<defs>
<linearGradient id="p2-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F4EB"/><stop offset="1" stop-color="#EEEADF"/></linearGradient>
<radialGradient id="p2-glow" cx="82%" cy="30%" r="55%"><stop offset="0" stop-color="#DAD5C6" stop-opacity=".55"/><stop offset="1" stop-color="#CBC6B6" stop-opacity="0"/></radialGradient>
<pattern id="p2-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#3A3A38" stroke-opacity=".07"/></pattern>
<filter id="p2-gf" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="p2-clip"><rect width="1200" height="350" rx="18"/></clipPath>
<linearGradient id="p2-tr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0C0E"/><stop offset=".45" stop-color="#1A1A19"/><stop offset="1" stop-color="#3A3A38" stop-opacity="0"/></linearGradient>
</defs>
<style>.p2-serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif}
.p2-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.p2-sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.p2-in{animation:p2-in 1.2s cubic-bezier(.16,1,.3,1) both}
.p2-d1{animation-delay:.15s}.p2-d2{animation-delay:.4s}.p2-d3{animation-delay:.65s}
.p2-chip{animation:p2-chip .7s cubic-bezier(.34,1.56,.64,1) both}
.p2-draw{stroke-dasharray:700;stroke-dashoffset:700;animation:p2-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards}
.p2-trace{stroke-dasharray:564 3136;stroke-dashoffset:3700;animation:p2-trace 7s linear infinite}
@keyframes p2-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes p2-chip{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes p2-draw{to{stroke-dashoffset:0}}
@keyframes p2-trace{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.p2-in,.p2-chip{animation:none}.p2-draw{animation:none;stroke-dashoffset:0}.p2-trace{display:none}}
</style>
<g clip-path="url(#p2-clip)">
<rect width="1200" height="350" fill="url(#p2-bg)"/>
<rect x="720" width="480" height="350" fill="url(#p2-grid)"/>
<rect width="1200" height="350" fill="url(#p2-glow)"/>
<g class="p2-in p2-d1">
<text class="p2-mono" x="56" y="56" font-size="12" letter-spacing="2.6" fill="#3A3A38">02 · WEB APP · PRODUCTIVITY</text>
<text class="p2-serif" x="54" y="114" font-size="46" font-weight="300" letter-spacing="-1.2" fill="#0B0C0E">TaskFlow</text>
<text class="p2-sans" x="56" y="152" font-size="17" fill="#5E5D58">A simple interface for organising what needs doing next.</text>
<text class="p2-mono" x="56" y="184" font-size="12.5" fill="#1A1A19"><tspan fill="#3A3A38">BUILT ›</tspan> a web-based task manager that keeps the interface simple</text>
<line class="p2-draw" x1="56" y1="210" x2="680" y2="210" stroke="#3A3A38" stroke-opacity=".3"/>
<g transform="translate(56 252)"><text class="p2-serif" font-size="26" font-weight="300" fill="#0B0C0E">Organise</text><text class="p2-sans" y="22" font-size="12.5" fill="#5E5D58">tasks by status</text></g><g transform="translate(261 252)"><text class="p2-serif" font-size="26" font-weight="300" fill="#0B0C0E">Simple</text><text class="p2-sans" y="22" font-size="12.5" fill="#5E5D58">low-friction UI</text></g><g transform="translate(466 252)"><text class="p2-serif" font-size="26" font-weight="300" fill="#0B0C0E">Web</text><text class="p2-sans" y="22" font-size="12.5" fill="#5E5D58">runs in the browser</text></g>
<g class="p2-chip" style="animation-delay:1.00s"><rect x="56" y="298" width="54" height="26" rx="13" fill="#F1EEE4" stroke="#3A3A38" stroke-opacity=".35"/><text class="p2-mono" x="83.0" y="315" text-anchor="middle" font-size="11.5" fill="#1A1A19">HTML</text></g><g class="p2-chip" style="animation-delay:1.10s"><rect x="118" y="298" width="47" height="26" rx="13" fill="#F1EEE4" stroke="#3A3A38" stroke-opacity=".35"/><text class="p2-mono" x="141.5" y="315" text-anchor="middle" font-size="11.5" fill="#1A1A19">CSS</text></g><g class="p2-chip" style="animation-delay:1.20s"><rect x="173" y="298" width="96" height="26" rx="13" fill="#F1EEE4" stroke="#3A3A38" stroke-opacity=".35"/><text class="p2-mono" x="221.0" y="315" text-anchor="middle" font-size="11.5" fill="#1A1A19">JavaScript</text></g>
</g>
<g class="p2-in p2-d2"><g transform="translate(730 50)"><text class="p2-mono" x="4" y="14" font-size="10.5" letter-spacing="2" fill="#5E5D58">TO DO</text><rect x="0" y="24" width="128" height="206" rx="10" fill="#FCFAF5" stroke="#3A3A38" stroke-opacity=".2"/><rect x="10" y="44" width="108" height="30" rx="6" fill="#E9E5D8" stroke="#3A3A38" stroke-opacity=".25"/><rect x="20" y="56" width="60" height="4" rx="2" fill="#0B0C0E" fill-opacity=".25"/><rect x="10" y="84" width="108" height="30" rx="6" fill="#E9E5D8" stroke="#3A3A38" stroke-opacity=".25"/><rect x="20" y="96" width="60" height="4" rx="2" fill="#0B0C0E" fill-opacity=".25"/><rect x="10" y="124" width="108" height="30" rx="6" fill="#E9E5D8" stroke="#3A3A38" stroke-opacity=".25"/><rect x="20" y="136" width="60" height="4" rx="2" fill="#0B0C0E" fill-opacity=".25"/><text class="p2-mono" x="144" y="14" font-size="10.5" letter-spacing="2" fill="#5E5D58">DOING</text><rect x="140" y="24" width="128" height="206" rx="10" fill="#FCFAF5" stroke="#3A3A38" stroke-opacity=".2"/><rect x="150" y="44" width="108" height="30" rx="6" fill="#E9E5D8" stroke="#3A3A38" stroke-opacity=".25"/><rect x="160" y="56" width="60" height="4" rx="2" fill="#0B0C0E" fill-opacity=".25"/><rect x="150" y="84" width="108" height="30" rx="6" fill="#E9E5D8" stroke="#3A3A38" stroke-opacity=".25"/><rect x="160" y="96" width="60" height="4" rx="2" fill="#0B0C0E" fill-opacity=".25"/><text class="p2-mono" x="284" y="14" font-size="10.5" letter-spacing="2" fill="#5E5D58">DONE</text><rect x="280" y="24" width="128" height="206" rx="10" fill="#FCFAF5" stroke="#3A3A38" stroke-opacity=".2"/><rect x="290" y="44" width="108" height="30" rx="6" fill="#E9E5D8" stroke="#3A3A38" stroke-opacity=".25"/><rect x="300" y="56" width="60" height="4" rx="2" fill="#0B0C0E" fill-opacity=".25"/><g><rect x="10" y="164" width="108" height="30" rx="6" fill="#E9E5D8" stroke="#000000" stroke-opacity=".9" filter="url(#p2-gf)"/><rect x="20" y="176" width="70" height="4" rx="2" fill="#000000"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;140 -84;140 -84;0 0" keyTimes="0;.15;.4;.85;1" dur="7s" repeatCount="indefinite"/></g></g></g>
<rect x=".5" y=".5" width="1199" height="349" rx="17.5" fill="none" stroke="#3A3A38" stroke-opacity=".2"/>
<rect class="p2-trace" x=".5" y=".5" width="1199" height="349" rx="17.5" fill="none" stroke="url(#p2-tr)" stroke-width="1.6" stroke-linecap="round"/>
</g></svg>