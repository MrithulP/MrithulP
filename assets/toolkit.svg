<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="tk-t">
<title id="tk-t">Toolkit. Languages: Python (primary), C, C++, JavaScript, R, SQL. Data and AI: data science, machine learning, data analysis, computer vision. Web: HTML, CSS, JavaScript. Tools: Git, GitHub, VS Code, MySQL, Unreal Engine.</title>
<defs>
<linearGradient id="tk-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F4EB"/><stop offset="1" stop-color="#EEEADF"/></linearGradient>
<radialGradient id="tk-glow" cx="82%" cy="30%" r="55%"><stop offset="0" stop-color="#DAD5C6" stop-opacity=".55"/><stop offset="1" stop-color="#CBC6B6" stop-opacity="0"/></radialGradient>
<pattern id="tk-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#3A3A38" stroke-opacity=".07"/></pattern>
<filter id="tk-gf" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="tk-clip"><rect width="1200" height="330" rx="18"/></clipPath>
<linearGradient id="tk-tr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0C0E"/><stop offset=".45" stop-color="#1A1A19"/><stop offset="1" stop-color="#3A3A38" stop-opacity="0"/></linearGradient>
</defs>
<style>.tk-serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif}
.tk-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.tk-sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.tk-in{animation:tk-in 1.2s cubic-bezier(.16,1,.3,1) both}
.tk-d1{animation-delay:.15s}.tk-d2{animation-delay:.4s}.tk-d3{animation-delay:.65s}
.tk-chip{animation:tk-chip .7s cubic-bezier(.34,1.56,.64,1) both}
.tk-draw{stroke-dasharray:700;stroke-dashoffset:700;animation:tk-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards}
.tk-trace{stroke-dasharray:564 3136;stroke-dashoffset:3700;animation:tk-trace 7s linear infinite}
@keyframes tk-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes tk-chip{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes tk-draw{to{stroke-dashoffset:0}}
@keyframes tk-trace{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.tk-in,.tk-chip{animation:none}.tk-draw{animation:none;stroke-dashoffset:0}.tk-trace{display:none}}
</style>
<g clip-path="url(#tk-clip)">
<rect width="1200" height="330" fill="url(#tk-bg)"/>
<rect x="1200" width="0" height="330" fill="url(#tk-grid)"/>
<rect width="1200" height="330" fill="url(#tk-glow)"/>
<g class="tk-in" style="animation-delay:0.20s"><text class="tk-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#3A3A38">LANGUAGES</text><line x1="56" y1="78" x2="306" y2="78" stroke="#3A3A38" stroke-opacity=".25"/></g><g class="tk-chip" style="animation-delay:0.60s"><rect x="56" y="102" width="68" height="26" rx="13" fill="#F1EEE4" stroke="#000000" stroke-opacity=".8"/><text class="tk-mono" x="90.0" y="119" text-anchor="middle" font-size="11.5" fill="#1A1A19">Python</text></g><g class="tk-chip" style="animation-delay:0.70s"><rect x="132" y="102" width="33" height="26" rx="13" fill="#F1EEE4" stroke="#3A3A38" stroke-opacity=".35"/><text class="tk-mono" x="148.5" y="119" text-anchor="middle" font-size="11.5" fill="#1A1A19">C</text></g><g class="tk-chip" style="animation-delay:0.80s"><rect x="173" y="102" width="47" height="26" rx="13" fill="#F1EEE4" stroke="#3A3A38" stroke-opacity=".35"/><text class="tk-mono" x="196.5" y="119" text-anchor="middle" font-size="11.5" fill="#1A1A19">C++</text></g><g class="tk-chip" style="animation-delay:0.90s"><rect x="56" y="138" width="96" height="26" rx="13" fill="#F1EEE4" stroke="#3A3A38" stroke-opacity=".35"/><text class="tk-mono" x="104.0" y="155" text-anchor="middle" font-size="11.5" fill="#1A1A19">JavaScript</text></g><g class="tk-chip" style="animation-delay:1.00s"><rect x="160" y="138" width="33" height="26" rx="13" fill="#F1EEE4" stroke="#3A3A38" stroke-opacity=".35"/><text class="tk-mono" x="176.5" y="155" text-anchor="middle" font-size="11.5" fill="#1A1A19">R</text></g><g class="tk-chip" style="animation-delay:1.10s"><rect x="201" y="138" width="47" height="26" rx="13" fill="#F1EEE4" stroke="#3A3A38" stroke-opacity=".35"/><text class="tk-mono" x="224.5" y="155" text-anchor="middle" font-size="11.5" fill="#1A1A19">SQL</text></g><g class="tk-in" style="animation-delay:0.32s"><text class="tk-mono" x="341" y="62" font-size="12" letter-spacing="2.6" fill="#3A3A38">DATA &amp; AI</text><line x1="341" y1="78" x2="591" y2="78" stroke="#3A3A38" stroke-opacity=".25"/></g><g class="tk-chip" style="animation-delay:0.80s"><rect x="341" y="102" width="110" height="26" rx="13" fill="#F1EEE4" stroke="#3A3A38" stroke-opacity=".35"/><text class="tk-mono" x="396.0" y="119" text-anchor="middle" font-size="11.5" fill="#1A1A19">Data Science</text></g><g class="tk-chip" style="animation-delay:0.90s"><rect x="341" y="138" width="138" height="26" rx="13" fill="#F1EEE4" stroke="#3A3A38" stroke-opacity=".35"/><text class="tk-mono" x="410.0" y="155" text-anchor="middle" font-size="11.5" fill="#1A1A19">Machine Learning</text></g><g class="tk-chip" style="animation-delay:1.00s"><rect x="341" y="174" width="117" height="26" rx="13" fill="#F1EEE4" stroke="#3A3A38" stroke-opacity=".35"/><text class="tk-mono" x="399.5" y="191" text-anchor="middle" font-size="11.5" fill="#1A1A19">Data Analysis</text></g><g class="tk-chip" style="animation-delay:1.10s"><rect x="341" y="210" width="131" height="26" rx="13" fill="#F1EEE4" stroke="#3A3A38" stroke-opacity=".35"/><text class="tk-mono" x="406.5" y="227" text-anchor="middle" font-size="11.5" fill="#1A1A19">Computer Vision</text></g><g class="tk-in" style="animation-delay:0.44s"><text class="tk-mono" x="626" y="62" font-size="12" letter-spacing="2.6" fill="#3A3A38">WEB</text><line x1="626" y1="78" x2="876" y2="78" stroke="#3A3A38" stroke-opacity=".25"/></g><g class="tk-chip" style="animation-delay:1.00s"><rect x="626" y="102" width="54" height="26" rx="13" fill="#F1EEE4" stroke="#3A3A38" stroke-opacity=".35"/><text class="tk-mono" x="653.0" y="119" text-anchor="middle" font-size="11.5" fill="#1A1A19">HTML</text></g><g class="tk-chip" style="animation-delay:1.10s"><rect x="688" y="102" width="47" height="26" rx="13" fill="#F1EEE4" stroke="#3A3A38" stroke-opacity=".35"/><text class="tk-mono" x="711.5" y="119" text-anchor="middle" font-size="11.5" fill="#1A1A19">CSS</text></g><g class="tk-chip" style="animation-delay:1.20s"><rect x="743" y="102" width="96" height="26" rx="13" fill="#F1EEE4" stroke="#3A3A38" stroke-opacity=".35"/><text class="tk-mono" x="791.0" y="119" text-anchor="middle" font-size="11.5" fill="#1A1A19">JavaScript</text></g><g class="tk-in" style="animation-delay:0.56s"><text class="tk-mono" x="911" y="62" font-size="12" letter-spacing="2.6" fill="#3A3A38">TOOLS</text><line x1="911" y1="78" x2="1161" y2="78" stroke="#3A3A38" stroke-opacity=".25"/></g><g class="tk-chip" style="animation-delay:1.20s"><rect x="911" y="102" width="47" height="26" rx="13" fill="#F1EEE4" stroke="#3A3A38" stroke-opacity=".35"/><text class="tk-mono" x="934.5" y="119" text-anchor="middle" font-size="11.5" fill="#1A1A19">Git</text></g><g class="tk-chip" style="animation-delay:1.30s"><rect x="966" y="102" width="68" height="26" rx="13" fill="#F1EEE4" stroke="#3A3A38" stroke-opacity=".35"/><text class="tk-mono" x="1000.0" y="119" text-anchor="middle" font-size="11.5" fill="#1A1A19">GitHub</text></g><g class="tk-chip" style="animation-delay:1.40s"><rect x="1042" y="102" width="75" height="26" rx="13" fill="#F1EEE4" stroke="#3A3A38" stroke-opacity=".35"/><text class="tk-mono" x="1079.5" y="119" text-anchor="middle" font-size="11.5" fill="#1A1A19">VS Code</text></g><g class="tk-chip" style="animation-delay:1.50s"><rect x="911" y="138" width="61" height="26" rx="13" fill="#F1EEE4" stroke="#3A3A38" stroke-opacity=".35"/><text class="tk-mono" x="941.5" y="155" text-anchor="middle" font-size="11.5" fill="#1A1A19">MySQL</text></g><g class="tk-chip" style="animation-delay:1.60s"><rect x="980" y="138" width="117" height="26" rx="13" fill="#F1EEE4" stroke="#3A3A38" stroke-opacity=".35"/><text class="tk-mono" x="1038.5" y="155" text-anchor="middle" font-size="11.5" fill="#1A1A19">Unreal Engine</text></g><text class="tk-mono" x="56" y="300" font-size="11" letter-spacing="1.5" fill="#5E5D58"><tspan fill="#000000">●</tspan> PRIMARY LANGUAGE</text>
<rect x=".5" y=".5" width="1199" height="329" rx="17.5" fill="none" stroke="#3A3A38" stroke-opacity=".2"/>
<rect class="tk-trace" x=".5" y=".5" width="1199" height="329" rx="17.5" fill="none" stroke="url(#tk-tr)" stroke-width="1.6" stroke-linecap="round"/>
