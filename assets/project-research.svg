<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" role="img" aria-labelledby="p4-t">
<title id="p4-t">Beyond Object Detection: Towards Danger Understanding in Computer Vision, a research paper.</title>
<defs>
<linearGradient id="p4-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F4EB"/><stop offset="1" stop-color="#EEEADF"/></linearGradient>
<radialGradient id="p4-glow" cx="82%" cy="30%" r="55%"><stop offset="0" stop-color="#DAD5C6" stop-opacity=".55"/><stop offset="1" stop-color="#CBC6B6" stop-opacity="0"/></radialGradient>
<pattern id="p4-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#3A3A38" stroke-opacity=".07"/></pattern>
<filter id="p4-gf" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="p4-clip"><rect width="1200" height="350" rx="18"/></clipPath>
<linearGradient id="p4-tr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0C0E"/><stop offset=".45" stop-color="#1A1A19"/><stop offset="1" stop-color="#3A3A38" stop-opacity="0"/></linearGradient>
</defs>
<style>.p4-serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif}
.p4-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.p4-sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.p4-in{animation:p4-in 1.2s cubic-bezier(.16,1,.3,1) both}
.p4-d1{animation-delay:.15s}.p4-d2{animation-delay:.4s}.p4-d3{animation-delay:.65s}
.p4-chip{animation:p4-chip .7s cubic-bezier(.34,1.56,.64,1) both}
.p4-draw{stroke-dasharray:700;stroke-dashoffset:700;animation:p4-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards}
.p4-trace{stroke-dasharray:564 3136;stroke-dashoffset:3700;animation:p4-trace 7s linear infinite}
@keyframes p4-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes p4-chip{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes p4-draw{to{stroke-dashoffset:0}}
@keyframes p4-trace{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.p4-in,.p4-chip{animation:none}.p4-draw{animation:none;stroke-dashoffset:0}.p4-trace{display:none}}
</style>
<g clip-path="url(#p4-clip)">
<rect width="1200" height="350" fill="url(#p4-bg)"/>
<rect x="720" width="480" height="350" fill="url(#p4-grid)"/>
<rect width="1200" height="350" fill="url(#p4-glow)"/>
<g class="p4-in p4-d1">
<text class="p4-mono" x="56" y="56" font-size="12" letter-spacing="2.6" fill="#3A3A38">04 · RESEARCH · COMPUTER VISION</text>
<text class="p4-serif" x="54" y="114" font-size="42" font-weight="300" letter-spacing="-1.2" fill="#0B0C0E">Beyond Object Detection</text>
<text class="p4-sans" x="56" y="152" font-size="17" fill="#5E5D58">Towards danger understanding in computer vision.</text>
<text class="p4-mono" x="56" y="184" font-size="12.5" fill="#1A1A19"><tspan fill="#3A3A38">BUILT ›</tspan> a research paper on moving from &quot;what is it&quot; to &quot;is it dangerous&quot;</text>
<line class="p4-draw" x1="56" y1="210" x2="680" y2="210" stroke="#3A3A38" stroke-opacity=".3"/>
<g transform="translate(56 252)"><text class="p4-serif" font-size="26" font-weight="300" fill="#0B0C0E">Vision</text><text class="p4-sans" y="22" font-size="12.5" fill="#5E5D58">beyond detection</text></g><g transform="translate(261 252)"><text class="p4-serif" font-size="26" font-weight="300" fill="#0B0C0E">Danger</text><text class="p4-sans" y="22" font-size="12.5" fill="#5E5D58">understanding</text></g><g transform="translate(466 252)"><text class="p4-serif" font-size="26" font-weight="300" fill="#0B0C0E">Paper</text><text class="p4-sans" y="22" font-size="12.5" fill="#5E5D58">research write-up</text></g>
<g class="p4-chip" style="animation-delay:1.00s"><rect x="56" y="298" width="131" height="26" rx="13" fill="#F1EEE4" stroke="#3A3A38" stroke-opacity=".35"/><text class="p4-mono" x="121.5" y="315" text-anchor="middle" font-size="11.5" fill="#1A1A19">Computer Vision</text></g><g class="p4-chip" style="animation-delay:1.10s"><rect x="195" y="298" width="82" height="26" rx="13" fill="#F1EEE4" stroke="#3A3A38" stroke-opacity=".35"/><text class="p4-mono" x="236.0" y="315" text-anchor="middle" font-size="11.5" fill="#1A1A19">Research</text></g><g class="p4-chip" style="animation-delay:1.20s"><rect x="285" y="298" width="40" height="26" rx="13" fill="#F1EEE4" stroke="#3A3A38" stroke-opacity=".35"/><text class="p4-mono" x="305.0" y="315" text-anchor="middle" font-size="11.5" fill="#1A1A19">AI</text></g>
</g>
<g class="p4-in p4-d2"><g transform="translate(730 50)"><rect x="0" y="0" width="420" height="240" rx="12" fill="#EFEBDF" stroke="#3A3A38" stroke-opacity=".3"/><g fill="#CFCABB"><circle cx="105" cy="78" r="18"/><rect x="82" y="100" width="46" height="90" rx="14"/></g><g fill="#CFCABB"><rect x="260" y="150" width="110" height="46" rx="6"/></g><polygon points="315,100 340,148 290,148" fill="none" stroke="#000000" stroke-width="3" stroke-linejoin="round"/><text class="p4-mono" x="315" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#000000">!</text><rect x="64" y="46" width="82" height="150" rx="4" fill="none" stroke="#3A3A38" stroke-width="1.5"/><rect x="64" y="28" width="92" height="18" rx="3" fill="#3A3A38"/><text class="p4-mono" x="70" y="41" font-size="10" font-weight="700" fill="#F7F4EB">person 0.98</text><rect x="250" y="84" width="130" height="122" rx="4" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="250" y="66" width="98" height="18" rx="3" fill="#000000"/><text class="p4-mono" x="256" y="79" font-size="10" font-weight="700" fill="#F7F4EB">danger 0.91</text><rect x="0" y="0" width="420" height="30" fill="#1A1A19" fill-opacity=".08"><animate attributeName="y" values="0;210;0" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></rect></g></g>
<rect x=".5" y=".5" width="1199" height="349" rx="17.5" fill="none" stroke="#3A3A38" stroke-opacity=".2"/>
<rect class="p4-trace" x=".5" y=".5" width="1199" height="349" rx="17.5" fill="none" stroke="url(#p4-tr)" stroke-width="1.6" stroke-linecap="round"/>
</g></svg>