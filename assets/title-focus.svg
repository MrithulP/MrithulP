<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="02 Focus: What I&#x27;m exploring.">
<defs>
<linearGradient id="tf-line" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0"><stop offset="0" stop-color="#3A3A38"/><stop offset=".6" stop-color="#DAD5C6"/><stop offset="1" stop-color="#DAD5C6" stop-opacity="0"/></linearGradient>
<linearGradient id="tf-sheen" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#1A1A19"/><stop offset=".5" stop-color="#6B6A64"/><stop offset="1" stop-color="#1A1A19"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;1500 0;1500 0" keyTimes="0;.4;1" dur="7s" begin="1.5s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="tf-pulse"><stop offset="0" stop-color="#000"/><stop offset=".5" stop-color="#1A1A19" stop-opacity=".6"/><stop offset="1" stop-color="#3A3A38" stop-opacity="0"/></radialGradient>
</defs>
<style>.tf-serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif}
.tf-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.tf-sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.tf-in{animation:tf-in 1.2s cubic-bezier(.16,1,.3,1) both}
.tf-d1{animation-delay:.15s}.tf-d2{animation-delay:.4s}.tf-d3{animation-delay:.65s}
.tf-chip{animation:tf-chip .7s cubic-bezier(.34,1.56,.64,1) both}
.tf-draw{stroke-dasharray:700;stroke-dashoffset:700;animation:tf-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards}
.tf-trace{stroke-dasharray:564 3136;stroke-dashoffset:3700;animation:tf-trace 7s linear infinite}
@keyframes tf-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes tf-chip{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes tf-draw{to{stroke-dashoffset:0}}
@keyframes tf-trace{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.tf-in,.tf-chip{animation:none}.tf-draw{animation:none;stroke-dashoffset:0}.tf-trace{display:none}}
</style>
<g class="tf-in"><text class="tf-mono" x="40" y="34" font-size="15" letter-spacing="3" fill="#3A3A38"><tspan fill="#1A1A19">02</tspan>   FOCUS</text></g>
<g class="tf-in tf-d2"><text class="tf-serif" x="38" y="84" font-size="48" font-weight="300" letter-spacing="-1" fill="#0B0C0E">What I&#x27;m <tspan font-style="italic" fill="url(#tf-sheen)">exploring.</tspan></text></g>
<g class="tf-in tf-d3"><text class="tf-mono" x="1160" y="34" text-anchor="end" font-size="13" letter-spacing="2.4" fill="#3A3A38">CURRENTLY</text></g>
<path class="tf-draw" d="M40 106 H1160" stroke="url(#tf-line)" stroke-width="1"/>
<circle cx="40" cy="106" r="7" fill="url(#tf-pulse)" opacity="0"><animate attributeName="cx" values="40;1160" dur="6s" begin="2.3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/><animate attributeName="opacity" values="0;1;0" keyTimes="0;.15;1" dur="6s" begin="2.3s" repeatCount="indefinite"/></circle>
</svg>